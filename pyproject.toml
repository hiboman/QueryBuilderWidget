[project]
name = "query-builder-widget"
description = "A small query builder widget for Django."
version = "1.3.0"
requires-python = ">=3.13"

dependencies = []

[dependency-groups]
dev = [
    "django>=6.0.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["query_builder_widget"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
